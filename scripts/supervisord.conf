[supervisord]
nodaemon=true
user=root
logfile=/app/.edge-logs/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :99 -screen 0 1365x768x24 -nolisten tcp
autorestart=true
priority=10

[program:x11vnc]
command=x11vnc -display :99 -localhost -rfbport 5900 -forever -shared -quiet -nopw
autorestart=true
priority=20

[program:websockify]
command=websockify --web /usr/share/novnc 6080 127.0.0.1:5900
autorestart=true
priority=30

[program:edge_worker]
command=npm run edge:worker
autorestart=true
priority=40
environment=DISPLAY=":99",EDGE_HEADLESS="false",EDGE_CHROMIUM_SANDBOX="false"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
