services:
  edge-worker:
    image: dwelling-fee-edge:latest
    build:
      context: .
      dockerfile: Dockerfile.edge
    container_name: df_edge_worker_01
    restart: unless-stopped
    shm_size: '2gb' # Critical: allocates 2GB shared memory for Chromium to prevent crashes
    ports:
      - "6080:6080" # noVNC HTML5 web port
    volumes:
      - edge_profile_data:/app/.edge-profile
      - edge_logs_data:/app/.edge-logs
    env_file:
      - .env.edge.local
    environment:
      - EDGE_CHROMIUM_SANDBOX=false
      - EDGE_HEADLESS=false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  edge_profile_data:
    driver: local
  edge_logs_data:
    driver: local
